name: CI

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
      - "bugfix/**"
      - "refactor/**"
      - "chore/**"
  pull_request:
    branches:
      - develop
      - main

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:

  # ── Job 1: Build and Unit Tests ─────────────────────────
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore AutomotiveDMS.slnx

      - name: Build
        run: >
          dotnet build AutomotiveDMS.slnx
          --no-restore
          --configuration Release
          -warnaserror

      - name: Unit Tests
        run: >
          dotnet test tests/AutomotiveDMS.UnitTests/AutomotiveDMS.UnitTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=unit-test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/

  # ── Job 2: Integration Tests ─────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      ConnectionStrings__DefaultConnection: ${{ secrets.INTEGRATION_TEST_CONNECTION_STRING }}

      Seed__AdminEmail: ${{ secrets.INTEGRATION_TEST_SEED_ADMIN_EMAIL }}
      Seed__AdminPassword: ${{ secrets.INTEGRATION_TEST_SEED_ADMIN_PASSWORD }}
      Seed__AdminFirstName: ${{ secrets.INTEGRATION_TEST_SEED_ADMIN_FIRSTNAME }}
      Seed__AdminLastName: ${{ secrets.INTEGRATION_TEST_SEED_ADMIN_LASTNAME }}

      DOTNET_ENVIRONMENT: Integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore AutomotiveDMS.slnx

      - name: Build
        run: >
          dotnet build AutomotiveDMS.slnx
          --no-restore
          --configuration Release

      - name: Integration Tests
        run: >
          dotnet test tests/AutomotiveDMS.IntegrationTests/AutomotiveDMS.IntegrationTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=integration-test-results.trx"
          --results-directory ./TestResults

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults/

  # ── Job 3: Docker Build ───────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: automotivedms:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max